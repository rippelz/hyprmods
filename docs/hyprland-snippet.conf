# After `hyprmods migrate`, base hyprland.conf only needs this APPEND
# (hyprmods migrate does this for you — it never replaces your full config):

#################
### HYPRMODS  ###
#################
# Project installs managed by ~/.local/bin/hyprmods
# Toggle install/uninstall with: hyprmods  |  Super+Y
source = ~/.config/hypr/hyprmods.conf

# Generated file holds (only for ENABLED projects):
#   exec-once, binds, source mode.conf / infini.conf, plugins
# Manager binds (Super+Y) always stay present.
#
# NOTE: On Hyprland 0.55+, if ~/.config/hypr/hyprland.lua exists, this
# .conf file is ignored. Use docs/hyprland-snippet.lua instead (or
# `hyprmods migrate`, which auto-detects).
